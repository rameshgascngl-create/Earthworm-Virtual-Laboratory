<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated renderer capability tests</title>
<style>
body{margin:0;background:white}.hit{fill:transparent;stroke:transparent}.layer{display:none}.layer.active{display:inline}
.procedure-demo{display:none}.procedure-active .procedure-demo{display:inline}.stroke-first{paint-order:stroke}
.stripes{width:120px;height:80px;background:repeating-linear-gradient(90deg,#f00 0 5px,#00f 5px 10px);position:absolute;left:10px;top:120px}
.blurred{position:absolute;inset:0;backdrop-filter:blur(5px)}
</style></head><body>
<svg width="800" height="110" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="gradient"><stop stop-color="#f00"/><stop offset="1" stop-color="#00f"/></linearGradient><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".2" numOctaves="2" seed="4"/></filter></defs>
<rect x="10" y="10" width="50" height="50" fill="#22cc44"/><rect class="hit" x="10" y="10" width="50" height="50"/>
<rect x="90" y="10" width="50" height="50" fill="#22cc44"/><g class="layer"><rect x="90" y="10" width="50" height="50" fill="red"/></g>
<g class="layer active"><rect x="150" y="10" width="20" height="50" fill="#22cc44"/></g>
<rect x="190" y="10" width="80" height="50" fill="url(#gradient)"/>
<rect class="stroke-first" x="310" y="20" width="60" height="50" fill="#22cc44" stroke="black" stroke-width="24"/>
<rect x="410" y="10" width="70" height="70" filter="url(#noise)"/>
<rect x="500" y="10" width="50" height="50" fill="#22cc44"/><g class="procedure-demo"><rect x="500" y="10" width="50" height="50" fill="red"/></g>
</svg><div class="stripes"><div class="blurred"></div></div>
</body></html>
