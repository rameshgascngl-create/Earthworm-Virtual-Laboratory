plugins { id 'com.android.application' }

def releaseStorePath = System.getenv('EARTHWORM_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('EARTHWORM_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('EARTHWORM_KEY_ALIAS')
def releaseKeyPassword = System.getenv('EARTHWORM_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isBlank() }

android {
    namespace 'in.ramesh.zoology.earthwormlab'
    compileSdk 36
    defaultConfig {
        applicationId 'in.ramesh.zoology.earthwormlab'
        minSdk 24
        targetSdk 36
        versionCode 10307
        versionName '1.3.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
