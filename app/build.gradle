plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def releaseStorePath = System.getenv('EARTHWORM_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('EARTHWORM_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('EARTHWORM_KEY_ALIAS')
def releaseKeyPassword = System.getenv('EARTHWORM_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isBlank() }

def generatedIconResDir = file("$buildDir/generated/iconRes")

tasks.register('generateLauncherIcon') {
    def payloadDir = file('src/main/icon-payload')
    def outputFile = file("$buildDir/generated/iconRes/drawable-nodpi/ic_launcher_source.webp")
    inputs.files(fileTree(payloadDir) { include 'part*.b64' })
    outputs.file(outputFile)
    doLast {
        def parts = fileTree(payloadDir) { include 'part*.b64' }.files.sort { it.name }
        if (parts*.name != (0..7).collect { String.format('part%02d.b64', it) }) {
            throw new GradleException("Launcher payload must contain exactly part00.b64 through part07.b64")
        }
        def encoded = parts.collect { it.getText('UTF-8').trim() }.join('')
        byte[] bytes = encoded.decodeBase64()
        def expectedSize = 23974
        def expectedSha = '2ade2a9eedd49679a0b0f15a42a4d75852771272ea6ba0944e8f118a93a8a931'
        def actualSha = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        if (bytes.length != expectedSize) throw new GradleException("Launcher WebP size mismatch: " + bytes.length)
        if (actualSha != expectedSha) throw new GradleException("Launcher WebP SHA-256 mismatch: " + actualSha)
        def ascii = java.nio.charset.StandardCharsets.US_ASCII
        if (new String(bytes, 0, 4, ascii) != 'RIFF' || new String(bytes, 8, 4, ascii) != 'WEBP') {
            throw new GradleException("Launcher payload is not a RIFF/WebP image")
        }
        def riffLength = java.nio.ByteBuffer.wrap(bytes, 4, 4).order(java.nio.ByteOrder.LITTLE_ENDIAN).getInt() + 8
        if (riffLength != bytes.length) throw new GradleException("Launcher WebP RIFF length mismatch")
        outputFile.parentFile.mkdirs()
        outputFile.bytes = bytes
    }
}

android {
    namespace 'in.ramesh.zoology.earthwormlab'
    compileSdk 36
    defaultConfig {
        applicationId 'in.ramesh.zoology.earthwormlab'
        minSdk 24
        targetSdk 36
        versionCode 10308
        versionName '1.3.8'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main { res.srcDir generatedIconResDir }
    }
    buildFeatures { buildConfig true; compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    // No androidx.webkit dependency on this branch: Phase 1 has zero WebView/
    // HTML/JS surface, by requirement, not by oversight. Do not re-add it
    // here — the hybrid payload stays on main/the archive branches only.

    def composeBom = platform('androidx.compose:compose-bom:2025.01.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0' // AppCompatActivity + AppCompatDelegate per-app locales, API 24+
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}


tasks.named('preBuild').configure {
    dependsOn tasks.named('generateLauncherIcon')
}
