name: Reconstruct release-authoritative HQ atlas payload
on:
  push:
    branches:
      - reconstruction/v1.3.9-hq-atlas-20260926
permissions:
  contents: write
concurrency:
  group: earthworm-hq-reconstruction
  cancel-in-progress: false
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch frozen historical candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/hq-candidate-5dbc6fe-20260926
          git show 92f3acd2497b95e1930b3acdbe4859403178b426:app/src/main/assets/index.html > /tmp/historical-hq.html
          test "$(sha256sum /tmp/historical-hq.html | awk '{print $1}')" = "5dbc6fe5754891a0c6dd6b5d307be232e35a1d244fcca72788749991cbc8affd"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Reconstruct from hardened v1.3.8 baseline
        run: |
          python tools/reconstruct_hq_atlas.py \
            --historical /tmp/historical-hq.html \
            --target app/src/main/assets/index.html \
            --manifest review/HQ_ATLAS_RELEASE_CANDIDATE_MANIFEST.json \
            --source-manifest SOURCE-MANIFEST.json
          sha256sum app/src/main/assets/index.html
          cat review/HQ_ATLAS_RELEASE_CANDIDATE_MANIFEST.json
      - name: Commit candidate and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html SOURCE-MANIFEST.json review/HQ_ATLAS_RELEASE_CANDIDATE_MANIFEST.json
          git commit -m "Reconstruct HQ atlas payload from hardened v1.3.8 baseline"
          git push origin "HEAD:$GITHUB_REF_NAME"
