name: Native Phase 3A interaction foundation build
on:
  push:
    branches:
      - native/v3-phase3a-interaction-foundation-ci

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Phase 3A source and raster provenance
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, xml.etree.ElementTree as ET

          content_path = pathlib.Path("app/src/main/res/raw/earthworm_content_v138.json")
          raw = content_path.read_bytes()
          expected = "f13e823bd1fdb97eb45dc154ed06cd52a9a52a8282ba0adbdad0458661cf1aea"
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, (actual, expected)

          data = json.loads(raw.decode("utf-8"))
          assert len(data["systems"]) == 9
          assert len(data["structures"]) == 55
          assert sum(len(v) if isinstance(v, list) else 1 for v in data["questions"].values()) == 72

          counts = {}
          for structure in data["structures"].values():
              counts[structure["system"]] = counts.get(structure["system"], 0) + 1
          assert counts == {
              "external": 9,
              "digestive": 7,
              "circulatory": 7,
              "respiratory": 4,
              "excretory": 4,
              "reproductive": 7,
              "nervous": 5,
              "crosssection": 12,
          }, counts

          manifest = json.loads(pathlib.Path("reference/PHASE3A-HQ-RASTER-PROVENANCE.json").read_text())
          assert manifest["policy"]["recompressed"] is False
          assert manifest["policy"]["regenerated"] is False
          assert manifest["policy"]["interactive_hotspots_on_raster"] is False
          assert len(manifest["images"]) == 8

          def webp_dimensions(blob):
              assert blob[0:4] == b"RIFF" and blob[8:12] == b"WEBP"
              chunk = blob[12:16]
              if chunk == b"VP8 ":
                  w = int.from_bytes(blob[26:28], "little") & 0x3fff
                  h = int.from_bytes(blob[28:30], "little") & 0x3fff
                  return w, h
              if chunk == b"VP8X":
                  w = 1 + int.from_bytes(blob[24:27], "little")
                  h = 1 + int.from_bytes(blob[27:30], "little")
                  return w, h
              if chunk == b"VP8L":
                  b1,b2,b3,b4 = blob[21:25]
                  w = 1 + (((b2 & 0x3f) << 8) | b1)
                  h = 1 + (((b4 & 0x0f) << 10) | (b3 << 2) | ((b2 & 0xc0) >> 6))
                  return w, h
              raise AssertionError(chunk)

          for image in manifest["images"]:
              p = pathlib.Path("app/src/main/res/drawable-nodpi") / image["file"]
              assert p.is_file(), p
              git_sha = subprocess.check_output(["git", "hash-object", str(p)], text=True).strip()
              assert git_sha == image["git_blob_sha"], (p, git_sha, image["git_blob_sha"])
              dims = webp_dimensions(p.read_bytes()[:64])
              assert dims == (2048, 1536), (p, dims)
              print(p, "GIT_BLOB", git_sha, "DIMENSIONS", dims)

          pairs = [
              ("atlas_external_en.svg", "en-external.svg"),
              ("atlas_digestive_en.svg", "en-digestive.svg"),
              ("atlas_circulatory_en.svg", "en-circulatory.svg"),
              ("atlas_respiratory_en.svg", "en-respiratory.svg"),
              ("atlas_excretory_en.svg", "en-excretory.svg"),
              ("atlas_reproductive_en.svg", "en-reproductive.svg"),
              ("atlas_nervous_en.svg", "en-nervous.svg"),
              ("atlas_crosssection_en.svg", "en-crosssection.svg"),
              ("atlas_external_ta.svg", "ta-external.svg"),
              ("atlas_digestive_ta.svg", "ta-digestive.svg"),
              ("atlas_circulatory_ta.svg", "ta-circulatory.svg"),
              ("atlas_respiratory_ta.svg", "ta-respiratory.svg"),
              ("atlas_excretory_ta.svg", "ta-excretory.svg"),
              ("atlas_reproductive_ta.svg", "ta-reproductive.svg"),
              ("atlas_nervous_ta.svg", "ta-nervous.svg"),
              ("atlas_crosssection_ta.svg", "ta-crosssection.svg"),
          ]

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          allowed_classes = {"organ-label", "micro-label", "orientation-note"}

          for app_name, ref_name in pairs:
              app_path = pathlib.Path("app/src/main/res/raw") / app_name
              ref_path = pathlib.Path("review/legacy-extractions/svg") / ref_name
              app_root = ET.parse(app_path).getroot()
              ref_root = ET.parse(ref_path).getroot()
              assert app_root.attrib.get("viewBox") == ref_root.attrib.get("viewBox"), app_name
              app_nodes = list(app_root.iter())
              ref_nodes = list(ref_root.iter())
              assert len(app_nodes) == len(ref_nodes), (app_name, len(app_nodes), len(ref_nodes))

              for i, (a, r) in enumerate(zip(app_nodes, ref_nodes)):
                  assert local(a.tag) == local(r.tag), (app_name, i)
                  assert (a.text or "") == (r.text or ""), (app_name, i, "text changed")
                  assert (a.tail or "") == (r.tail or ""), (app_name, i, "tail changed")
                  aa = dict(a.attrib)
                  rr = dict(r.attrib)
                  a_style = aa.pop("style", None)
                  r_style = rr.pop("style", None)
                  assert aa == rr, (app_name, i, "non-style attribute changed")
                  if a_style != r_style:
                      assert local(a.tag) == "text"
                      assert aa.get("class", "") in allowed_classes

          atlas_source = pathlib.Path("app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt").read_text()
          for token in [
              "R.drawable.hq_external",
              "R.drawable.hq_digestive",
              "R.drawable.hq_circulatory",
              "R.drawable.hq_respiratory",
              "R.drawable.hq_excretory",
              "R.drawable.hq_reproductive",
              "R.drawable.hq_nervous",
              "R.drawable.hq_crosssection",
              "rememberTransformableState",
              "atlas_labels_visible",
              "atlas_mode_reference",
          ]:
              assert token in atlas_source, token

          print("CONTENT_INVARIANTS=PASS")
          print("SVG_SEMANTIC_IDENTITY=PASS")
          print("HQ_RASTER_PROVENANCE=PASS")
          print("PHASE3A_INTERACTION_SOURCE=PASS")
          PY

          test "$(find app/src/main/res/raw -maxdepth 1 -name 'atlas_*_en.svg' | wc -l)" -eq 8
          test "$(find app/src/main/res/raw -maxdepth 1 -name 'atlas_*_ta.svg' | wc -l)" -eq 8
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'hq_*.webp' | wc -l)" -eq 8

          if grep -RInE --include='*.kt' 'android\.webkit|androidx\.webkit|WebViewAssetLoader|\bWebView\b' app/src/main/java; then
            echo "UNEXPECTED_APP_WEBVIEW_SOURCE=YES"
            exit 31
          fi
          echo "UNEXPECTED_APP_WEBVIEW_SOURCE=NO"

      - name: Clean
        run: gradle --no-daemon clean

      - name: Lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble Debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"

          {
            echo "APK=$APK"
            sha256sum "$APK"

            echo
            echo "== BADGING =="
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"

            echo
            echo "== PERMISSIONS =="
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"

            echo
            echo "== BROWSER PAYLOAD =="
            if zipinfo -1 "$APK" | grep -Ei '\.(html|css|js)$'; then
              echo "UNEXPECTED_BROWSER_PAYLOAD=YES"
              exit 41
            else
              echo "UNEXPECTED_BROWSER_PAYLOAD=NO"
            fi

            echo
            echo "== ATLAS SVG PAYLOAD =="
            SVG_COUNT="$(zipinfo -1 "$APK" | grep -Ec '(^|/)atlas_(external|digestive|circulatory|respiratory|excretory|reproductive|nervous|crosssection)_(en|ta)\.svg$' || true)"
            echo "ATLAS_SVG_COUNT=$SVG_COUNT"
            test "$SVG_COUNT" -eq 16

            echo
            echo "== HQ RASTER PAYLOAD =="
            HQ_COUNT="$(zipinfo -1 "$APK" | grep -Ec '(^|/)hq_(external|digestive|circulatory|respiratory|excretory|reproductive|nervous|crosssection)\.webp$' || true)"
            echo "HQ_WEBP_COUNT=$HQ_COUNT"
            test "$HQ_COUNT" -eq 8

            echo
            echo "== DEX CLASS CHECKS =="
            TMP="$(mktemp -d)"
            unzip -qq "$APK" 'classes*.dex' -d "$TMP"

            if find "$TMP" -name 'classes*.dex' -print0 | while IFS= read -r -d '' dex; do
                 "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$dex"
               done | grep -E "Class descriptor.*L(android|androidx)/webkit/|Class descriptor.*WebViewAssetLoader"; then
              echo "UNEXPECTED_PACKAGED_WEBKIT_CLASS=YES"
              exit 42
            else
              echo "UNEXPECTED_PACKAGED_WEBKIT_CLASS=NO"
            fi

            if find "$TMP" -name 'classes*.dex' -print0 | xargs -0 strings | grep -q 'com/caverock/androidsvg/SVG'; then
              echo "ANDROIDSVG_RUNTIME_PRESENT=YES"
            else
              echo "ANDROIDSVG_RUNTIME_PRESENT=NO"
              exit 43
            fi
          } | tee apk-inspection.txt

      - name: Release structural compile
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: earthworm-native-phase3a-interaction-foundation-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: earthworm-native-phase3a-interaction-foundation-unsigned-release
          path: app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: warn

      - name: Upload APK inspection
        uses: actions/upload-artifact@v4
        with:
          name: earthworm-native-phase3a-interaction-foundation-apk-inspection
          path: apk-inspection.txt
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthworm-native-phase3a-interaction-foundation-lint
          path: app/build/reports/lint-results*
          if-no-files-found: warn
