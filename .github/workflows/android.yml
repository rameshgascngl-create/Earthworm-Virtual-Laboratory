name: Validate Earthworm Android source and release candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase-3B authorised-diff integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE=788fe9cbd298c300de7a1c4551db1a0553e98e3e
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository\.kt|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised Phase-3B changes detected:"
            echo "$bad"
            exit 1
          fi
          echo "Phase-3B diff is restricted to guided/physiology UI plumbing and CI."
      - name: Preserve Phase-2B native/content integrity
        run: node tests/native-phase2b-preflight.cjs
      - name: Verify Phase-3A1 narration layer is frozen
        shell: bash
        run: |
          set -euo pipefail
          BASE=788fe9cbd298c300de7a1c4551db1a0553e98e3e
          test -z "$(git diff --name-only "$BASE" HEAD -- app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt)"
      - name: Verify frozen scientific and atlas assets are untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE=788fe9cbd298c300de7a1c4551db1a0553e98e3e
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/res/raw/atlas_*.svg             app/src/main/res/drawable-nodpi             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt)"
      - name: Phase-3B guided-content contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('app/src/main/res/raw/earthworm_content_v138.json','utf8'));
          const modules=j.guidedModules||{};
          const systems=['external','digestive','circulatory','respiratory','excretory','reproductive','nervous','crosssection'];
          let count=0;
          for (const key of systems) {
            if (!Array.isArray(modules[key]) || modules[key].length===0) throw new Error('Missing guided module: '+key);
            for (const step of modules[key]) {
              if (!step.target) throw new Error('Guided step without target in '+key);
              if (!j.structures[step.target]) throw new Error('Unknown guided target: '+step.target);
              if (j.structures[step.target].system!==key) throw new Error('Guided target assigned to wrong system: '+step.target);
              count++;
            }
          }
          if (count!==51) throw new Error('Expected 51 anatomical guided steps, got '+count);
          console.log('PASS guided anatomical steps:',count);
          NODE
          grep -q 'guidedStepsFor' app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository.kt
          grep -q 'respiratorySequence' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          grep -q '"mucus-film", "moist-epidermis", "cutaneous-capillaries", "cutaneous-exchange"' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          grep -q 'atlas_physiology_notice' app/src/main/res/values/strings.xml
          grep -q 'atlas_physiology_notice' app/src/main/res/values-ta/strings.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint and actual compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3B-device-QA-candidate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3B-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
