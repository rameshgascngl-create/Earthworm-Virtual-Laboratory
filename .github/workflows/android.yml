name: Validate native privacy screen on Android 16

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: earthworm-native-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authorised native-privacy diff only
        shell: bash
        run: |
          set -euo pipefail
          BASE=2208eba380e375f1b6156caa7f6374e1af410c62
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormApp\.kt|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen\.kt|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/privacy/PrivacyPolicyScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised files changed during native privacy correction:"
            echo "$bad"
            exit 1
          fi

      - name: Preserve native scientific/content integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Native privacy navigation contract
        shell: bash
        run: |
          set -euo pipefail
          APP=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormApp.kt
          PREP=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen.kt
          PRIV=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/privacy/PrivacyPolicyScreen.kt
          EN=app/src/main/res/values/strings.xml
          TA=app/src/main/res/values-ta/strings.xml

          grep -q 'var showPrivacyPolicy by rememberSaveable' "$APP"
          grep -q 'enabled = showPrivacyPolicy || uiState.canNavigateBack' "$APP"
          grep -q 'if (showPrivacyPolicy)' "$APP"
          grep -q 'PrivacyPolicyScreen' "$APP"
          grep -q 'onPrivacyPolicy = { showPrivacyPolicy = true }' "$APP"
          grep -q 'onClick = onPrivacyPolicy' "$PREP"
          ! grep -q 'Intent.ACTION_VIEW' "$PREP"
          ! grep -q 'Uri.parse' "$PREP"
          ! grep -q 'LocalContext' "$PREP"

          grep -q 'privacy_screen_title' "$PRIV"
          grep -q 'privacy_policy_url' "$PRIV"
          grep -q 'privacy_back' "$PRIV"
          grep -q 'Privacy Policy' "$EN"
          grep -q 'தனியுரிமைக் கொள்கை' "$TA"

      - name: Public store policy remains available
        shell: bash
        run: |
          set -euo pipefail
          URL='https://rameshgascngl-create.github.io/Earthworm-Virtual-Laboratory/privacy.html'
          grep -Fq "$URL" app/src/main/res/values/strings.xml
          tmp="$(mktemp)"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$URL" -o "$tmp"
          grep -q '<title>Privacy Policy — Earthworm Virtual Laboratory</title>' "$tmp"
          grep -q 'in.ramesh.zoology.earthwormlab' "$tmp"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R --line-number -E 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|READ_CONTACTS)' app/src/main/AndroidManifest.xml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android lint and compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-native-privacy-Android16-device-QA
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-native-privacy-Android16-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
