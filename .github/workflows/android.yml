name: Validate Earthworm Android source and release candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase-3C.1 authorised-diff integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE=87b57f17ab61ee25503fc238b345def62ddc92ab
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml|app/src/main/res/raw/atlas_digestive_en\.svg|app/src/main/res/raw/atlas_digestive_ta\.svg)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised Phase-3C.1 changes detected:"
            echo "$bad"
            exit 1
          fi

      - name: Preserve Phase-2B native/content integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Verify frozen scientific, process, TTS and non-digestive atlas layers
        shell: bash
        run: |
          set -euo pipefail
          BASE=87b57f17ab61ee25503fc238b345def62ddc92ab
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository.kt             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/res/drawable-nodpi             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt)"
          changed_svg="$(git diff --name-only "$BASE" HEAD -- 'app/src/main/res/raw/atlas_*.svg' || true)"
          unexpected="$(printf '%s\n' "$changed_svg" | grep -Ev '^(app/src/main/res/raw/atlas_digestive_en\.svg|app/src/main/res/raw/atlas_digestive_ta\.svg)?$' || true)"
          test -z "$unexpected"

      - name: Phase-3C.1 spatial-behaviour contract
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          grep -q 'if (system != EarthwormSystem.RESPIRATORY)' "$A"
          grep -q 'if (system == EarthwormSystem.RESPIRATORY) return' "$A"
          grep -q 'SemanticZoomTier.OVERVIEW' "$A"
          grep -q 'SemanticZoomTier.DETAIL' "$A"
          ! grep -q 'SemanticZoomTier.DEEP' "$A"
          grep -q 'scale < 1.7f' "$A"
          grep -q 'horizontalScroll(rememberScrollState())' "$A"
          grep -q 'scaleX = 1f / scale' "$A"
          grep -q 'scaleY = 1f / scale' "$A"
          ! grep -q 'semanticZoomTier == SemanticZoomTier.OVERVIEW && !orientationMode' "$A"

      - name: Digestive atlas scientific-label contract
        shell: bash
        run: |
          set -euo pipefail
          EN=app/src/main/res/raw/atlas_digestive_en.svg
          TA=app/src/main/res/raw/atlas_digestive_ta.svg
          grep -q 'Gizzard · VIII / IX–X' "$EN"
          grep -q 'Glandular stomach · post-gizzard, pre-XV' "$EN"
          grep -q 'Intestinal caeca · origin XXVII' "$EN"
          grep -q 'அரவைப்பை · VIII / IX–X' "$TA"
          grep -q 'சுரப்புமிகு இரைப்பை · அரவைப்பைக்குப் பின், XV-க்கு முன்' "$TA"
          grep -q 'குடல் நீட்சிகள் · தொடக்கம் XXVII' "$TA"
          ! grep -q 'Gizzard VIII†' "$EN"
          ! grep -q 'Stomach IX–XIV' "$EN"
          ! grep -q 'Intestinal caeca XXVI†' "$EN"
          ! grep -q 'அரவைப்பை VIII†' "$TA"
          ! grep -q 'இரைப்பை IX–XIV' "$TA"
          ! grep -q 'குடல் நீட்சிகள் XXVI†' "$TA"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for p in (
              "app/src/main/res/raw/atlas_digestive_en.svg",
              "app/src/main/res/raw/atlas_digestive_ta.svg",
          ):
              ET.parse(p)
              print("XML PASS", p)
          PY
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('app/src/main/res/raw/earthworm_content_v138.json','utf8'));
          if (!j.structures.gizzard.locEn.includes('IX–X') || !j.structures.gizzard.locEn.includes('VIII')) {
            throw new Error('Frozen gizzard source-variation statement missing');
          }
          if (!j.structures.stomach.locEn.includes('posterior to the gizzard') || !j.structures.stomach.locEn.includes('anterior to XV')) {
            throw new Error('Frozen stomach positional statement missing');
          }
          if (!j.structures['intestinal-caeca'].locEn.includes('originate in XXVII')) {
            throw new Error('Frozen caecal-origin statement missing');
          }
          console.log('PASS digestive visible labels align with frozen scientific content');
          NODE

      - name: Security/offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint and actual compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3C1-device-QA-candidate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3C1-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
