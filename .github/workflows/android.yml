name: Validate Earthworm Android source and release candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase-3B4C authorised-diff integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE=854ddf873ab1ed2626fb161b816e4d5f0296e691
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen\.kt|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised Phase-3B4C changes detected:"
            echo "$bad"
            exit 1
          fi
      - name: Preserve Phase-2B native/content integrity
        run: node tests/native-phase2b-preflight.cjs
      - name: Verify frozen scientific, atlas and TTS layers
        shell: bash
        run: |
          set -euo pipefail
          BASE=854ddf873ab1ed2626fb161b816e4d5f0296e691
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository.kt             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/res/raw/atlas_*.svg             app/src/main/res/drawable-nodpi             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt)"
      - name: Phase-3B4C nervous-conduction contract
        shell: bash
        run: |
          set -euo pipefail
          P=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt
          A=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('app/src/main/res/raw/earthworm_content_v138.json','utf8'));
          const ids=['cerebral-ganglia','circum-pharyngeal-connectives','subpharyngeal-ganglion','ventral-nerve-cord','segmental-ganglia'];
          for (const id of ids) {
            if (!j.structures[id]) throw new Error('Missing nervous process target: '+id);
            if (j.structures[id].system!=='nervous') throw new Error('Wrong system for '+id);
          }
          if (!/sensory/i.test(j.structures['cerebral-ganglia'].fnEn)) throw new Error('Cerebral sensory-integration support missing');
          if (!/relay impulses/i.test(j.structures['circum-pharyngeal-connectives'].fnEn)) throw new Error('Connective relay support missing');
          if (!/motor-integration/i.test(j.structures['subpharyngeal-ganglion'].sigEn)) throw new Error('Subpharyngeal motor-integration support missing');
          if (!/conducts impulses/i.test(j.structures['ventral-nerve-cord'].fnEn)) throw new Error('Ventral-cord conduction support missing');
          if (!/local muscles/i.test(j.structures['segmental-ganglia'].fnEn)) throw new Error('Segmental response support missing');
          console.log('PASS nervous targets and pathway evidence');
          NODE
          grep -q 'NERVOUS_CONDUCTION' "$P"
          grep -q 'EarthwormSystem.NERVOUS to ProcessDefinition' "$P"
          grep -q 'ProcessPhase.SENSORY_INTEGRATION' "$P"
          grep -q 'ProcessPhase.NERVE_RING_RELAY' "$P"
          grep -q 'ProcessPhase.LONGITUDINAL_CONDUCTION' "$P"
          grep -q 'ProcessPhase.SEGMENTAL_RESPONSE' "$P"
          grep -q 'The sensory receptors themselves are not represented as separate validated hotspots' "$P"
          grep -q 'The muscles themselves are not separate validated nervous-system hotspots' "$P"
          grep -q 'BiologicalProcess.NERVOUS_CONDUCTION' "$A"
          grep -q 'atlas_process_nervous_conduction' app/src/main/res/values/strings.xml
          grep -q 'atlas_process_nervous_conduction' app/src/main/res/values-ta/strings.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint and actual compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3B4C-device-QA-candidate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3B4C-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
