name: Validate privacy-link QA candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-privacy-link-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI-only branch integrity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=56272ffea4aa93942b3728bdd3f881f7a96e3ae0
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          unexpected="$(git diff --name-only "$SOURCE" HEAD | grep -Ev '^\.github/workflows/android\.yml$' || true)"
          test -z "$unexpected"

      - name: Privacy-launch correction scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=ed64c0f8505234e8949f5a5fa96e25c92e091c32
          SOURCE=56272ffea4aa93942b3728bdd3f881f7a96e3ae0
          changed="$(git diff --name-only "$BASE" "$SOURCE")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3

      - name: Preserve native anatomy and scientific integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Freeze renderer, navigation, anatomy and science
        shell: bash
        run: |
          set -euo pipefail
          BASE=ed64c0f8505234e8949f5a5fa96e25c92e091c32
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app             app/src/main/java/in/ramesh/zoology/earthwormlab/data             app/src/main/res/raw             app/src/main/res/drawable-nodpi             reference/assessments.json             app/src/main/AndroidManifest.xml             app/build.gradle)"

      - name: Privacy launcher contract
        shell: bash
        run: |
          set -euo pipefail
          P=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen.kt
          EN=app/src/main/res/values/strings.xml
          TA=app/src/main/res/values-ta/strings.xml
          grep -q 'Intent.ACTION_VIEW' "$P"
          grep -q 'Intent.CATEGORY_BROWSABLE' "$P"
          grep -q 'Intent.createChooser' "$P"
          grep -q 'privacy_policy_fallback_url' "$P"
          grep -q 'ClipboardManager' "$P"
          grep -q 'Toast.makeText' "$P"
          grep -q 'https://github.com/rameshgascngl-create/Earthworm-Virtual-Laboratory/blob/main/PRIVACY.md' "$EN"
          grep -q 'https://raw.githubusercontent.com/rameshgascngl-create/Earthworm-Virtual-Laboratory/main/PRIVACY.md' "$EN"
          grep -q 'privacy_policy_chooser_title' "$TA"
          grep -q 'privacy_policy_copied_message' "$TA"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -E 'android\.webkit\.WebView|WebViewClient|androidx\.webkit' app/src/main/java app/build.gradle
          ! find app/src/main -type f | grep -E '\.(html?|js|mjs|cjs)$'

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean Android lint, tests and compilation
        run: gradle --no-daemon clean :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease

      - name: Inspect privacy-link QA APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > qa-badging.txt
          "$AAPT" dump permissions "$APK" > qa-permissions.txt
          grep -q "package: name='in.ramesh.zoology.earthwormlab'" qa-badging.txt
          grep -q "versionCode='10308'" qa-badging.txt
          grep -q "versionName='1.3.8'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt
          {
            echo "source_commit=56272ffea4aa93942b3728bdd3f881f7a96e3ae0"
            echo "applicationId=in.ramesh.zoology.earthwormlab"
            echo "versionName=1.3.8"
            echo "versionCode=10308"
            echo "privacy_launcher=chooser_plus_raw_fallback_plus_clipboard"
            echo "INTERNET_permission=absent"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Privacy-Link-DEVICE-QA-CANDIDATE
          path: |
            app/build/outputs/apk/debug/*.apk
            qa-evidence.txt
            qa-badging.txt
            qa-permissions.txt
          if-no-files-found: error
