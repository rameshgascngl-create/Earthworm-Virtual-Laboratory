name: Validate Earthworm Android source and release candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase-3B2 authorised-diff integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE=53df9fdf088402fd15c8f7d6be727065f39185bb
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen\.kt|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised Phase-3B2 changes detected:"
            echo "$bad"
            exit 1
          fi
          echo "Phase-3B2 diff is restricted to process-learning orchestration/UI and CI."
      - name: Preserve Phase-2B native/content integrity
        run: node tests/native-phase2b-preflight.cjs
      - name: Verify Phase-3A1 narrator and Phase-3B content plumbing are frozen
        shell: bash
        run: |
          set -euo pipefail
          BASE=53df9fdf088402fd15c8f7d6be727065f39185bb
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository.kt)"
      - name: Verify frozen scientific and atlas assets are untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE=53df9fdf088402fd15c8f7d6be727065f39185bb
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/res/raw/atlas_*.svg             app/src/main/res/drawable-nodpi             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt)"
      - name: Phase-3B2 process-learning contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('app/src/main/res/raw/earthworm_content_v138.json','utf8'));
          const expected={
            respiratory:['mucus-film','moist-epidermis','cutaneous-exchange','cutaneous-capillaries'],
            circulatory:['dorsal-vessel','lateral-hearts','ventral-vessel','capillary-networks','subneural-vessel','lateral-oesophageal-vessels','supra-oesophageal-vessel']
          };
          for (const [system,targets] of Object.entries(expected)) {
            for (const id of targets) {
              if (!j.structures[id]) throw new Error('Missing process target: '+id);
              if (j.structures[id].system!==system) throw new Error('Wrong process system for '+id);
              for (const field of ['en','ta','fnEn','fnTa','sigEn','sigTa']) {
                if (!j.structures[id][field]) throw new Error('Missing '+field+' for '+id);
              }
            }
          }
          console.log('PASS process targets:', Object.values(expected).flat().length);
          NODE
          grep -q 'CUTANEOUS_RESPIRATION' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt
          grep -q 'BLOOD_CIRCULATION_OVERVIEW' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt
          grep -q 'processNarration' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          grep -q 'atlas_process_blood_circulation' app/src/main/res/values/strings.xml
          grep -q 'atlas_process_blood_circulation' app/src/main/res/values-ta/strings.xml
          ! grep -q 'atlas_guided_step_counter' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          ! grep -q 'guidedMode' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint and actual compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3B2-device-QA-candidate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3B2-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
