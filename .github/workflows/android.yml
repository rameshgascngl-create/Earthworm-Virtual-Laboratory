name: Validate SVG label renderer correction v3
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-svg-label-renderer-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI-only branch integrity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=51eeb0fab6ce205107d500370225217b942d1357
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          unexpected="$(git diff --name-only "$SOURCE" HEAD | grep -Ev '^\.github/workflows/android\.yml$' || true)"
          test -z "$unexpected"

      - name: Renderer correction authorised scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=55e9e4e71868c25383dba1432a08644f91f29dcc
          SOURCE=51eeb0fab6ce205107d500370225217b942d1357
          changed="$(git diff --name-only "$BASE" "$SOURCE")"
          printf '%s\n' "$changed"
          test "$changed" = "app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt"

      - name: Preserve native anatomy and scientific integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Freeze all SVG, HQ, scientific, process, TTS and home assets
        shell: bash
        run: |
          set -euo pipefail
          BASE=55e9e4e71868c25383dba1432a08644f91f29dcc
          test -z "$(git diff --name-only "$BASE" HEAD --             'app/src/main/res/raw/atlas_*.svg'             app/src/main/res/drawable-nodpi             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen.kt             app/src/main/res/values/strings.xml             app/src/main/res/values-ta/strings.xml             reference/assessments.json)"

      - name: Bright label rendering contract
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          grep -q 'normalizeAtlasLabelPresentation' "$A"
          grep -q 'fill:#ffffff;stroke:none' "$A"
          grep -q 'stroke: none;' "$A"
          grep -q 'stroke-width: 0;' "$A"
          grep -q 'font-weight:800' "$A"
          grep -q 'font-weight:700' "$A"
          ! grep -q 'organ-label{[^}]*stroke-width:3' "$A"
          ! grep -q 'micro-label{[^}]*stroke-width:2' "$A"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -E 'android\.webkit\.WebView|WebViewClient|androidx\.webkit' app/src/main/java app/build.gradle
          ! find app/src/main -type f | grep -E '\.(html?|js|mjs|cjs)$'

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean Android lint, tests and compilation
        run: gradle --no-daemon clean :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease

      - name: Inspect renderer-QA APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > qa-badging.txt
          "$AAPT" dump permissions "$APK" > qa-permissions.txt
          grep -q "package: name='in.ramesh.zoology.earthwormlab'" qa-badging.txt
          grep -q "versionCode='10308'" qa-badging.txt
          grep -q "versionName='1.3.8'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt
          {
            echo "source_commit=51eeb0fab6ce205107d500370225217b942d1357"
            echo "applicationId=in.ramesh.zoology.earthwormlab"
            echo "versionName=1.3.8"
            echo "versionCode=10308"
            echo "label_rendering=bright_white_no_dark_stroke"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-SVG-Label-Renderer-v3-DEVICE-QA-CANDIDATE
          path: |
            app/build/outputs/apk/debug/*.apk
            qa-evidence.txt
            qa-badging.txt
            qa-permissions.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-SVG-Label-Renderer-v3-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
