name: Validate Phase 3C.1 + Home native QA candidate
# CI-only companion workflow; application source is frozen at 55e9e4e71868c25383dba1432a08644f91f29dcc.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/phase3c1-home-validation-20260927
permissions:
  contents: read
concurrency:
  group: earthworm-home-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI-only branch integrity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=55e9e4e71868c25383dba1432a08644f91f29dcc
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          unexpected="$(git diff --name-only "$SOURCE" HEAD | grep -Ev '^\.github/workflows/android\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "CI branch modified application/source files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Home enhancement authorised source scope
        shell: bash
        run: |
          set -euo pipefail
          PHASE3C1=ce52e1ec397a67117b20003f0ab0488ff1854425
          SOURCE=55e9e4e71868c25383dba1432a08644f91f29dcc
          test "$(git merge-base "$PHASE3C1" "$SOURCE")" = "$PHASE3C1"
          changed="$(git diff --name-only "$PHASE3C1" "$SOURCE")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3

      - name: Preserve native anatomy and scientific integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Freeze Phase 3C.1 anatomy, physiology, TTS and assessment core
        shell: bash
        run: |
          set -euo pipefail
          BASE=ce52e1ec397a67117b20003f0ab0488ff1854425
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/res/raw/atlas_external_en.svg             app/src/main/res/raw/atlas_external_ta.svg             app/src/main/res/raw/atlas_digestive_en.svg             app/src/main/res/raw/atlas_digestive_ta.svg             app/src/main/res/raw/atlas_circulatory_en.svg             app/src/main/res/raw/atlas_circulatory_ta.svg             app/src/main/res/raw/atlas_respiratory_en.svg             app/src/main/res/raw/atlas_respiratory_ta.svg             app/src/main/res/raw/atlas_excretory_en.svg             app/src/main/res/raw/atlas_excretory_ta.svg             app/src/main/res/raw/atlas_reproductive_en.svg             app/src/main/res/raw/atlas_reproductive_ta.svg             app/src/main/res/raw/atlas_nervous_en.svg             app/src/main/res/raw/atlas_nervous_ta.svg             app/src/main/res/raw/atlas_crosssection_en.svg             app/src/main/res/raw/atlas_crosssection_ta.svg             app/src/main/res/drawable-nodpi             reference/assessments.json)"

      - name: Home, designer and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          P=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen.kt
          EN=app/src/main/res/values/strings.xml
          TA=app/src/main/res/values-ta/strings.xml
          grep -q 'HomeHeroCard' "$P"
          grep -q 'DesignerCreditCard' "$P"
          grep -q 'Intent.ACTION_VIEW' "$P"
          grep -q 'privacy_policy_action' "$P"
          grep -q '<string name="home_designer_name">R. Ramesh</string>' "$EN"
          grep -q '<string name="home_designer_department">Department of Zoology</string>' "$EN"
          grep -q '<string name="home_designer_institution">Government Arts and Science College, Nagercoil</string>' "$EN"
          grep -q '<string name="home_designer_name">R. Ramesh</string>' "$TA"
          grep -q '<string name="home_designer_department">விலங்கியல் துறை</string>' "$TA"
          grep -q 'privacy_policy_url' "$EN"
          grep -q 'github.com/rameshgascngl-create/Earthworm-Virtual-Laboratory/blob/main/PRIVACY.md' "$EN"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -E 'android\.webkit\.WebView|WebViewClient|androidx\.webkit' app/src/main/java app/build.gradle
          ! find app/src/main -type f | grep -E '\.(html?|js|mjs|cjs)$'

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean Android lint, tests and compilation
        run: gradle --no-daemon clean :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease

      - name: Inspect QA APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"

          "$AAPT" dump badging "$APK" > qa-badging.txt
          "$AAPT" dump permissions "$APK" > qa-permissions.txt
          "$AAPT2" dump resources "$APK" > qa-resources.txt

          grep -q "package: name='in.ramesh.zoology.earthwormlab'" qa-badging.txt
          grep -q "versionCode='10308'" qa-badging.txt
          grep -q "versionName='1.3.8'" qa-badging.txt
          grep -q "sdkVersion:'24'" qa-badging.txt
          grep -q "targetSdkVersion:'36'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt

          for n in external digestive circulatory respiratory excretory reproductive nervous crosssection; do
            grep -q "hq_atlas_${n}" qa-resources.txt
          done
          for n in external digestive circulatory respiratory excretory reproductive nervous crosssection; do
            grep -q "atlas_${n}_en" qa-resources.txt
            grep -q "atlas_${n}_ta" qa-resources.txt
          done

          if unzip -l "$APK" | grep -E '\.(html?|js|mjs|cjs)$'; then
            echo "Unexpected browser payload packaged"
            exit 1
          fi

          {
            echo "source_commit=55e9e4e71868c25383dba1432a08644f91f29dcc"
            echo "ci_commit=$GITHUB_SHA"
            echo "applicationId=in.ramesh.zoology.earthwormlab"
            echo "versionName=1.3.8"
            echo "versionCode=10308"
            echo "minSdk=24"
            echo "targetSdk=36"
            echo "INTERNET_permission=absent"
            echo "HQ_WebPs=8/8"
            echo "SVG_resources=16/16"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3C1-Home-DEVICE-QA-CANDIDATE
          path: |
            app/build/outputs/apk/debug/*.apk
            qa-evidence.txt
            qa-badging.txt
            qa-permissions.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3C1-Home-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c1-home-android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
