name: Validate final Tamil Nadu textbook terminology QA candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-tamil-textbook-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: CI-only branch integrity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=4c16543c060af2c735145f7b7cbe08f981da3581
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          unexpected="$(git diff --name-only "$SOURCE" HEAD | grep -Ev '^\.github/workflows/android\.yml$' || true)"
          test -z "$unexpected"

      - name: Tamil terminology authorised scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=56272ffea4aa93942b3728bdd3f881f7a96e3ae0
          SOURCE=4c16543c060af2c735145f7b7cbe08f981da3581
          changed="$(git diff --name-only "$BASE" "$SOURCE")"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 12
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance\.kt|app/src/main/res/raw/earthworm_content_v138\.json|reference/assessments\.json|app/src/main/res/values-ta/strings\.xml|app/src/main/res/raw/atlas_(external|digestive|circulatory|respiratory|excretory|reproductive|nervous|crosssection)_ta\.svg) || true)"
          test -z "$unexpected"

      - name: Prove JSON changes are Tamil-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          BASE="56272ffea4aa93942b3728bdd3f881f7a96e3ae0"
          files=[
              "app/src/main/res/raw/earthworm_content_v138.json",
              "reference/assessments.json",
          ]

          def old_json(path):
              return json.loads(subprocess.check_output(["git","show",f"{BASE}:{path}"], text=True))

          def strip_tamil(value):
              if isinstance(value, dict):
                  return {
                      k: strip_tamil(v)
                      for k,v in value.items()
                      if not (
                          k == "ta"
                          or k.endswith("Ta")
                          or k == "tamilTerminologyAudit"
                      )
                  }
              if isinstance(value, list):
                  return [strip_tamil(v) for v in value]
              return value

          for path in files:
              old=old_json(path)
              new=json.loads(Path(path).read_text(encoding="utf-8"))
              assert strip_tamil(old) == strip_tamil(new), f"Non-Tamil JSON content changed: {path}"
              print("PASS Tamil-only JSON changes", path)

          j=json.loads(Path(files[0]).read_text(encoding="utf-8"))
          assert len(j["structures"]) == 55
          assert sum(len(v) for v in j["questions"].values()) == 72
          print("PASS 55 structures / 72 questions")
          PY

      - name: Prove Tamil UI changes are limited to four terminology strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE="56272ffea4aa93942b3728bdd3f881f7a96e3ae0"
          path="app/src/main/res/values-ta/strings.xml"

          def read_map(text):
              root=ET.fromstring(text)
              return {e.attrib["name"]: "".join(e.itertext()) for e in root.findall("string")}

          old=read_map(subprocess.check_output(["git","show",f"{BASE}:{path}"], text=True))
          new=read_map(Path(path).read_text(encoding="utf-8"))
          assert set(old) == set(new), "Tamil UI string keys changed"
          changed={k for k in old if old[k] != new[k]}
          expected={
              "atlas_process_nephridial_excretion",
              "atlas_nephridial_compare_show",
              "atlas_nephridial_compare_title",
              "atlas_nephridial_compare_intro",
          }
          assert changed == expected, f"Unexpected Tamil UI string changes: {changed}"
          print("PASS exact Tamil UI terminology scope", sorted(changed))
          PY

      - name: Prove guided-process changes are Tamil strings only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          BASE="56272ffea4aa93942b3728bdd3f881f7a96e3ae0"
          path="app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt"
          old=subprocess.check_output(["git","show",f"{BASE}:{path}"], text=True)
          new=Path(path).read_text(encoding="utf-8")

          pattern=re.compile(r'(\b[A-Za-z0-9_]*Ta\s*=\s*)"[^"\n]*"')
          old_norm=pattern.sub(r'\1"<TAMIL>"', old)
          new_norm=pattern.sub(r'\1"<TAMIL>"', new)
          assert old_norm == new_norm, "ProcessGuidance changed outside *Ta string values"
          print("PASS ProcessGuidance Tamil-only")
          PY

      - name: Prove Tamil SVG geometry and coordinates are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE="56272ffea4aa93942b3728bdd3f881f7a96e3ae0"
          systems=["external","digestive","circulatory","respiratory","excretory","reproductive","nervous","crosssection"]

          def local(tag):
              return tag.rsplit("}",1)[-1]

          def compare(a,b,path):
              assert a.tag == b.tag, f"{path}: XML tag changed"
              aa={k:v for k,v in a.attrib.items() if k!="aria-label"}
              ba={k:v for k,v in b.attrib.items() if k!="aria-label"}
              assert aa == ba, f"{path}: non-ARIA attribute/geometry changed on {local(a.tag)}"
              if (a.text or "") != (b.text or ""):
                  assert local(a.tag) == "tspan", f"{path}: non-label XML text changed on {local(a.tag)}"
              assert (a.tail or "") == (b.tail or ""), f"{path}: XML tail changed"
              ac=list(a); bc=list(b)
              assert len(ac)==len(bc), f"{path}: XML child count changed"
              for x,y in zip(ac,bc):
                  compare(x,y,path)

          for s in systems:
              path=f"app/src/main/res/raw/atlas_{s}_ta.svg"
              old=ET.fromstring(subprocess.check_output(["git","show",f"{BASE}:{path}"]))
              new=ET.parse(path).getroot()
              compare(old,new,path)
              print("PASS Tamil text/ARIA-only SVG change", path)
          PY

      - name: Reject legacy Tamil terminology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
            "app/src/main/res/raw/earthworm_content_v138.json",
            "reference/assessments.json",
            "app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt",
            "app/src/main/res/values-ta/strings.xml",
            *[f"app/src/main/res/raw/atlas_{s}_ta.svg" for s in [
              "external","digestive","circulatory","respiratory",
              "excretory","reproductive","nervous","crosssection"
            ]]
          ]
          legacy=[
            "சளிப்பொருள்","கிளைட்ட","விந்தேற்ப","மலத்துளை","உணவுக்குழாய்",
            "அரவைப்பை","குடல் நீட்ச","டைஃப்ளோ","நெஃப்ரிடி","கியூட்டிக்கிள்",
            "முன்வாய்மடல்","தொண்டைசுற்று","தந்துகி","பைகிடியம்",
            "பெரிட்டோனியம்","இடைத்திரை நெஃப்ரீ","உடற்சுவர் நெஃப்ரீ",
            "கீழ்த்தொண்டை நரம்புத் திரள்","முதுகுத் துளை","நரம்புத் திரள்",
            "இரட்டை வயிற்றுப்புற நரம்புவடம்"
          ]
          joined="\n".join(Path(p).read_text(encoding="utf-8") for p in files)
          left=[x for x in legacy if x in joined]
          assert not left, f"Legacy Tamil terms remain: {left}"
          required=[
            "கோழை","புரோஸ்டோமியம்","கிளைடெல்லம்","விந்துகொள்பை",
            "மலவாய்","உணவுக்குழல்","அரைவைப்பை","குடல் பிதுக்கம்",
            "டிப்லோசோல்","கியுட்டிகிள்","எபிடெர்மிஸ்","நெஃப்ரீடியா",
            "நரம்பு செல் திரள்","வயிற்றுப்புற இரட்டை நரம்புவடம்"
          ]
          missing=[x for x in required if x not in joined]
          assert not missing, f"Required textbook terms missing: {missing}"
          print("PASS legacy-term rejection and canonical-term presence")
          PY

      - name: Freeze non-Tamil application layers
        shell: bash
        run: |
          set -euo pipefail
          BASE=56272ffea4aa93942b3728bdd3f881f7a96e3ae0
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen.kt             'app/src/main/res/raw/atlas_*_en.svg'             app/src/main/res/drawable-nodpi             app/src/main/res/values             app/src/main/res/values-ta             app/src/main/AndroidManifest.xml             app/build.gradle)"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -E '^[[:space:]]*import[[:space:]]+android\.webkit\.(WebView|WebViewClient)' app/src/main/java
          ! grep -R -E '\bWebView[[:space:]]*\(' app/src/main/java
          ! grep -E '^[[:space:]]*(implementation|api|runtimeOnly|compileOnly).*androidx\.webkit' app/build.gradle

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean Android lint, tests and compilation
