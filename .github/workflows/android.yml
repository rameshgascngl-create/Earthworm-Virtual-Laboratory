name: Validate Android 16 privacy-launch correction

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: earthworm-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authorised privacy-correction diff only
        shell: bash
        run: |
          set -euo pipefail
          BASE=4c16543c060af2c735145f7b7cbe08f981da3581
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|PRIVACY\.md|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised files changed during privacy correction:"
            echo "$bad"
            exit 1
          fi

      - name: Preserve native scientific/content integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Privacy launcher contract
        shell: bash
        run: |
          set -euo pipefail
          K=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/preparation/PreparationScreen.kt
          S=app/src/main/res/values/strings.xml
          URL='https://rameshgascngl-create.github.io/Earthworm-Virtual-Laboratory/privacy.html'

          grep -Fq "$URL" "$S"
          grep -q 'Intent(Intent.ACTION_VIEW, Uri.parse(url))' "$K"
          grep -q 'Intent.CATEGORY_BROWSABLE' "$K"
          grep -q 'context.startActivity(browserIntent)' "$K"
          ! grep -q 'Intent.createChooser' "$K"
          ! grep -q 'privacy_policy_fallback_url' "$K"
          ! grep -q 'privacy_policy_fallback_url' "$S"
          ! grep -q 'privacy_policy_chooser_title' "$K"
          ! grep -q 'privacy_policy_chooser_title' "$S"

      - name: Public privacy page availability
        shell: bash
        run: |
          set -euo pipefail
          URL='https://rameshgascngl-create.github.io/Earthworm-Virtual-Laboratory/privacy.html'
          tmp="$(mktemp)"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$URL" -o "$tmp"
          grep -q '<title>Privacy Policy — Earthworm Virtual Laboratory</title>' "$tmp"
          grep -q 'in.ramesh.zoology.earthwormlab' "$tmp"
          grep -q 'no INTERNET permission' "$tmp"

      - name: Privacy policy parity
        shell: bash
        run: |
          set -euo pipefail
          P=PRIVACY.md
          grep -q 'no INTERNET permission' "$P"
          grep -q 'last selected anatomical system or structure' "$P"
          grep -q 'local privacy-policy acknowledgement state' "$P"
          ! grep -q '^## Printing' "$P"
          ! grep -q 'guided-learning progress' "$P"
          ! grep -q 'review dates' "$P"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R --line-number -E 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|READ_CONTACTS)' app/src/main/AndroidManifest.xml

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android lint and compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-privacy-android16-device-QA-candidate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-privacy-android16-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
