name: Validate Earthworm Android source and release candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase-3C authorised-diff integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE=cb1c8189badfb93a3cbdb6e96c8ac10f8b89b52a
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          bad="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/android\.yml|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unauthorised Phase-3C changes detected:"
            echo "$bad"
            exit 1
          fi
      - name: Preserve Phase-2B native/content integrity
        run: node tests/native-phase2b-preflight.cjs
      - name: Verify frozen scientific, atlas, process and TTS layers
        shell: bash
        run: |
          set -euo pipefail
          BASE=cb1c8189badfb93a3cbdb6e96c8ac10f8b89b52a
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/ScientificContentRepository.kt             app/src/main/res/raw/earthworm_content_v138.json             app/src/main/res/raw/atlas_*.svg             app/src/main/res/drawable-nodpi             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt)"
      - name: Phase-3C spatial-intelligence contract
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt
          grep -q 'SemanticZoomTier' "$A"
          grep -q 'scale < 1.55f' "$A"
          grep -q 'scale < 2.6f' "$A"
          grep -q 'orientationMode' "$A"
          grep -q 'focusMode' "$A"
          grep -q 'SpatialOrientationOverlay' "$A"
          grep -q 'markerAlpha' "$A"
          grep -q 'size(40.dp)' "$A"
          grep -q 'semanticZoomTier = semanticZoomTier' "$A"
          grep -q 'atlas_orientation_mode' app/src/main/res/values/strings.xml
          grep -q 'atlas_focus_mode' app/src/main/res/values/strings.xml
          grep -q 'atlas_zoom_overview' app/src/main/res/values/strings.xml
          grep -q 'atlas_orientation_mode' app/src/main/res/values-ta/strings.xml
          grep -q 'atlas_focus_mode' app/src/main/res/values-ta/strings.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint and actual compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3C-device-QA-candidate
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-Phase3C-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
