name: Validate v1.3.9 navigation + v3 renderer QA candidate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-v139-nav-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI-only branch integrity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=ed64c0f8505234e8949f5a5fa96e25c92e091c32
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          unexpected="$(git diff --name-only "$SOURCE" HEAD | grep -Ev '^\.github/workflows/android\.yml$' || true)"
          test -z "$unexpected"

      - name: Navigation correction authorised scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=51eeb0fab6ce205107d500370225217b942d1357
          SOURCE=ed64c0f8505234e8949f5a5fa96e25c92e091c32
          changed="$(git diff --name-only "$BASE" "$SOURCE")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormApp\.kt|app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormViewModel\.kt|app/src/main/res/values/strings\.xml|app/src/main/res/values-ta/strings\.xml)$' || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4

      - name: Preserve native anatomy and scientific integrity
        run: node tests/native-phase2b-preflight.cjs

      - name: Freeze v3 renderer and all anatomical/scientific assets
        shell: bash
        run: |
          set -euo pipefail
          BASE=51eeb0fab6ce205107d500370225217b942d1357
          test -z "$(git diff --name-only "$BASE" HEAD --             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/AtlasScreen.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/ProcessGuidance.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/ui/atlas/StructureNarrator.kt             app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt             app/src/main/res/raw/earthworm_content_v138.json             'app/src/main/res/raw/atlas_*.svg'             app/src/main/res/drawable-nodpi             reference/assessments.json)"

      - name: Navigation history contract
        shell: bash
        run: |
          set -euo pipefail
          APP=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormApp.kt
          VM=app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormViewModel.kt
          EN=app/src/main/res/values/strings.xml
          TA=app/src/main/res/values-ta/strings.xml

          grep -q 'BackHandler' "$APP"
          grep -q 'enabled = uiState.canNavigateBack' "$APP"
          grep -q 'viewModel.navigateBack()' "$APP"
          grep -q 'onClick = viewModel::navigateHome' "$APP"

          grep -q 'KEY_NAVIGATION_HISTORY' "$VM"
          grep -q 'MAX_NAVIGATION_HISTORY = 32' "$VM"
          grep -q 'fun navigateBack()' "$VM"
          grep -q 'fun navigateHome()' "$VM"
          grep -q 'history.last()' "$VM"
          grep -q 'history.dropLast(1)' "$VM"
          grep -q 'takeLast(MAX_NAVIGATION_HISTORY)' "$VM"
          grep -q 'savedStateHandle\[KEY_NAVIGATION_HISTORY\] = arrayListOf<String>()' "$VM"
          grep -q 'if (currentKey == system.dataKey) return' "$VM"

          grep -q '<string name="nav_home">Home</string>' "$EN"
          grep -q '<string name="nav_home">முகப்பு</string>' "$TA"

      - name: Security and offline contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -E 'android\.webkit\.WebView|WebViewClient|androidx\.webkit' app/src/main/java app/build.gradle
          ! find app/src/main -type f | grep -E '\.(html?|js|mjs|cjs)$'

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean Android lint, tests and compilation
        run: gradle --no-daemon clean :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease

      - name: Inspect combined QA APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"

          "$AAPT" dump badging "$APK" > qa-badging.txt
          "$AAPT" dump permissions "$APK" > qa-permissions.txt
          "$AAPT2" dump resources "$APK" > qa-resources.txt

          grep -q "package: name='in.ramesh.zoology.earthwormlab'" qa-badging.txt
          grep -q "versionCode='10308'" qa-badging.txt
          grep -q "versionName='1.3.8'" qa-badging.txt
          grep -q "sdkVersion:'24'" qa-badging.txt
          grep -q "targetSdkVersion:'36'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt

          for n in external digestive circulatory respiratory excretory reproductive nervous crosssection; do
            grep -q "hq_atlas_${n}" qa-resources.txt
            grep -q "atlas_${n}_en" qa-resources.txt
            grep -q "atlas_${n}_ta" qa-resources.txt
          done

          if unzip -l "$APK" | grep -E '\.(html?|js|mjs|cjs)$'; then
            echo "Unexpected browser payload packaged"
            exit 1
          fi

          {
            echo "source_commit=ed64c0f8505234e8949f5a5fa96e25c92e091c32"
            echo "renderer_base=51eeb0fab6ce205107d500370225217b942d1357"
            echo "applicationId=in.ramesh.zoology.earthwormlab"
            echo "versionName=1.3.8"
            echo "versionCode=10308"
            echo "minSdk=24"
            echo "targetSdk=36"
            echo "navigation=back_history_plus_explicit_home"
            echo "renderer=v3_bright_stroke_free"
            echo "INTERNET_permission=absent"
            echo "HQ_WebPs=8/8"
            echo "SVG_resources=16/16"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-v3-Renderer-Navigation-DEVICE-QA-CANDIDATE
          path: |
            app/build/outputs/apk/debug/*.apk
            qa-evidence.txt
            qa-badging.txt
            qa-permissions.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-1.3.8-v3-Renderer-Navigation-unsigned-release-structural-check
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-renderer-navigation-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: warn
