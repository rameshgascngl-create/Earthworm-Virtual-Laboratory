name: Validate Earthworm native Android v2
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: earthworm-native-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail if browser runtime returns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.java' --include='*.kt' -E 'android\.webkit\.WebView|androidx\.webkit|WebViewAssetLoader|evaluateJavascript|addJavascriptInterface' app/src/main; then
            echo "Browser runtime detected in native source."
            exit 1
          fi
          if find app/src/main -type f -path '*/assets/index.html' -print -quit | grep -q .; then
            echo "Packaged HTML runtime detected."
            exit 1
          fi
          if grep -Fq 'androidx.webkit' app/build.gradle; then
            echo "AndroidX WebKit dependency detected."
            exit 1
          fi
          grep -Fq "versionName '2.0.0-alpha1'" app/build.gradle
          grep -Fq "versionCode 200001" app/build.gradle
          grep -Fq 'class AnatomyCanvas' app/src/main/java/in/ramesh/zoology/earthwormlab/AnatomyCanvas.java
          grep -Fq 'class ProgressStore' app/src/main/java/in/ramesh/zoology/earthwormlab/ProgressStore.java
          grep -Fq 'class AssessmentActivity' app/src/main/java/in/ramesh/zoology/earthwormlab/AssessmentActivity.java
          python3 - <<'PY'
          import json
          p='app/src/main/res/raw/earthworm_content_v138.json'
          d=json.load(open(p,encoding='utf-8'))
          c=d['provenance']['counts']
          expected={'structures':55,'guidedActions':56,'questions':72,'microscopicLessons':9,'systems':9,'procedureSteps':7}
          assert c==expected, (c, expected)
          assert len(d['structures'])==55
          assert sum(len(v) for v in d['guidedModules'].values())==56
          assert sum(len(v) for v in d['questions'].values())==72
          assert len(d['microscopicLessons'])==9
          assert all('svg' not in v for v in d['microscopicLessons'].values())
          # Scientific regression checks for Phase-1 corrected characters.
          structures=d['structures']
          questions=[q for group in d['questions'].values() for q in group]
          assert 'IX–X' in structures['gizzard']['locEn']
          assert 'XXVII' in structures['intestinal-caeca']['locEn']
          assert 'retained ventrally on the clitellum' in structures['setae']['locEn']
          assert 'last hearts are in XIII' in structures['lateral-hearts']['locEn']
          qtext='\n'.join(q.get('en','')+' '+str(q.get('oEn',[])) for q in questions)
          assert 'Which feature is absent from clitellar segments?' not in qtext
          assert 'Intestinal caeca arise near segment:' not in qtext
          assert 'Four pairs of hearts occur in:' not in qtext
          assert 'XXVII' in qtext
          # Visual/academic identity gate: every authoritative structure must have
          # exactly one native hotspot and there must be no orphan hotspot IDs.
          import re
          native=open('app/src/main/java/in/ramesh/zoology/earthwormlab/NativeData.java',encoding='utf-8').read()
          hotspot_ids=re.findall(r'\\bs\\("([^"]+)"',native)
          assert len(hotspot_ids)==55, len(hotspot_ids)
          assert len(set(hotspot_ids))==55, 'duplicate native hotspot id'
          assert set(hotspot_ids)==set(structures.keys()), (
              sorted(set(structures)-set(hotspot_ids)),
              sorted(set(hotspot_ids)-set(structures))
          )
          print('ACADEMIC DATASET RECONCILIATION: PASS', c)
          print('SCIENTIFIC REGRESSION GATE: PASS')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Lint and compile native application
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Static APK native-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          unzip -l "$APK" > apk-files.txt
          if grep -Fq 'assets/index.html' apk-files.txt; then
            echo "HTML runtime was packaged unexpectedly."
            exit 1
          fi
          if unzip -p "$APK" classes.dex | strings | grep -E 'android/webkit/WebView|androidx/webkit|WebViewAssetLoader' ; then
            echo "WebView symbols found in native APK."
            exit 1
          fi
          sha256sum "$APK" | tee native-debug-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-2.0.0-alpha1-native-debug-DO-NOT-SUBMIT
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            apk-files.txt
            native-debug-sha256.txt
          if-no-files-found: error
