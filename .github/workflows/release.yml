name: Build signed Earthworm v1.3.9 native release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthworm-v1.3.9-native-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production signing is permitted only from main."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frozen-source release scope
        shell: bash
        run: |
          set -euo pipefail
          FROZEN=749bf37d4feef36c8d511220d08a2eccb335f543
          git cat-file -e "$FROZEN^{commit}"
          bad="$(git diff --name-only "$FROZEN" HEAD | grep -Ev '^(app/build\.gradle|\.github/workflows/android\.yml|\.github/workflows/release\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Production tree differs from the validated device-QA source outside release engineering:"
            echo "$bad"
            exit 1
          fi

      - name: Version and native architecture gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "versionCode[[:space:]]+10309" app/build.gradle
          grep -Eq "versionName[[:space:]]+'1\.3\.9'" app/build.gradle
          grep -Fq "applicationId 'in.ramesh.zoology.earthwormlab'" app/build.gradle
          grep -Eq "minSdk[[:space:]]+24" app/build.gradle
          grep -Eq "targetSdk[[:space:]]+36" app/build.gradle
          test ! -e app/src/main/assets/index.html
          test -f app/src/main/java/in/ramesh/zoology/earthwormlab/MainActivity.kt
          test ! -e app/src/main/java/in/ramesh/zoology/earthwormlab/MainActivity.java
          test ! -e app/src/main/java/in/ramesh/zoology/earthwormlab/NativeHomeActivity.java
          test ! -e app/src/main/java/in/ramesh/zoology/earthwormlab/PrivacyActivity.java
          grep -q 'PrivacyPolicyScreen' app/src/main/java/in/ramesh/zoology/earthwormlab/ui/app/EarthwormApp.kt

      - name: Scientific/content freeze
        run: node tests/native-phase2b-preflight.cjs

      - name: Atlas/content count gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'hq_atlas_*.webp' | wc -l)" -eq 8
          test "$(find app/src/main/res/raw -maxdepth 1 -type f -name 'atlas_*_en.svg' | wc -l)" -eq 8
          test "$(find app/src/main/res/raw -maxdepth 1 -type f -name 'atlas_*_ta.svg' | wc -l)" -eq 8
          test "$(grep -Ec '^[[:space:]]+"[^"]+" to \(' app/src/main/java/in/ramesh/zoology/earthwormlab/data/StructureGeometry.kt)" -eq 55
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('app/src/main/res/raw/earthworm_content_v138.json','utf8'));
          if (j.provenance?.counts?.structures !== 55) throw new Error('structure count drift');
          if (j.provenance?.counts?.systems !== 9) throw new Error('system count drift');
          if (j.provenance?.counts?.questions !== 72) throw new Error('question-source count drift');
          NODE

      - name: Privacy and offline gate
        shell: bash
        run: |
          set -euo pipefail
          URL='https://rameshgascngl-create.github.io/Earthworm-Virtual-Laboratory/privacy.html'
          grep -Fq "$URL" app/src/main/res/values/strings.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          tmp="$(mktemp)"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$URL" -o "$tmp"
          grep -q '<title>Privacy Policy — Earthworm Virtual Laboratory</title>' "$tmp"

  signed-release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EARTHWORM_KEYSTORE_PASSWORD: ${{ secrets.EARTHWORM_KEYSTORE_PASSWORD }}
      EARTHWORM_KEY_ALIAS: ${{ secrets.EARTHWORM_KEY_ALIAS }}
      EARTHWORM_KEY_PASSWORD: ${{ secrets.EARTHWORM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore established production keystore
        shell: bash
        env:
          EARTHWORM_KEYSTORE_BASE64: ${{ secrets.EARTHWORM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$EARTHWORM_KEYSTORE_BASE64" || { echo "EARTHWORM_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$EARTHWORM_KEYSTORE_PASSWORD" || { echo "EARTHWORM_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$EARTHWORM_KEY_ALIAS" || { echo "EARTHWORM_KEY_ALIAS is missing."; exit 1; }
          test -n "$EARTHWORM_KEY_PASSWORD" || { echo "EARTHWORM_KEY_PASSWORD is missing."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/earthworm-release.jks"
          printf '%s' "$EARTHWORM_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "EARTHWORM_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          keytool -list -v             -keystore "$KEYSTORE_PATH"             -storepass "$EARTHWORM_KEYSTORE_PASSWORD"             -alias "$EARTHWORM_KEY_ALIAS" > keystore-evidence.txt

          KEYSTORE_SHA="$(sed -n 's/.*SHA256: //p' keystore-evidence.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED='b23c93c7eca0b2ab511cfdb970bae86b09c032bcbf33ba6ec26812e4e1bd32f7'
          test "$KEYSTORE_SHA" = "$EXPECTED" || {
            echo "Production signing certificate mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   $KEYSTORE_SHA"
            exit 1
          }
          echo "Established production certificate identity: PASS"

      - name: Clean signed native release build
        run: gradle --no-daemon clean :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n1)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
          test -n "$APK" && test -f "$APK" || { echo "Signed release APK not found."; exit 1; }
          test -n "$AAB" && test -f "$AAB" || { echo "Signed release AAB not found."; exit 1; }

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKANALYZER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          EXPECTED_CERT='b23c93c7eca0b2ab511cfdb970bae86b09c032bcbf33ba6ec26812e4e1bd32f7'

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-signing.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' release-signing.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' release-signing.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-signing.txt | head -n1)"
          test "$CERT_SHA256" = "$EXPECTED_CERT"

          jarsigner -verify "$AAB" > aab-signing.txt 2>&1
          grep -Fq 'jar verified.' aab-signing.txt

          "$APKANALYZER" manifest print "$APK" > release-manifest.xml
          "$AAPT" dump badging "$APK" > release-badging.txt
          "$AAPT" dump permissions "$APK" > release-permissions.txt

          APP_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" release-badging.txt | head -n1)"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" release-badging.txt | head -n1)"
          VERSION_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" release-badging.txt | head -n1)"
          MIN_SDK="$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" release-badging.txt | head -n1)"
          TARGET_SDK="$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" release-badging.txt | head -n1)"

          test "$APP_ID" = 'in.ramesh.zoology.earthwormlab'
          test "$VERSION_CODE" = '10309'
          test "$VERSION_NAME" = '1.3.9'
          test "$MIN_SDK" = '24'
          test "$TARGET_SDK" = '36'

          ! grep -Fq 'android:debuggable="true"' release-manifest.xml
          grep -Fq 'android:allowBackup="false"' release-manifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' release-manifest.xml
          grep -Fq 'in.ramesh.zoology.earthwormlab.MainActivity' release-manifest.xml
          ! grep -Fq 'NativeHomeActivity' release-manifest.xml
          ! grep -Fq 'PrivacyActivity' release-manifest.xml
          ! grep -Fq 'PreviewActivity' release-manifest.xml
          ! grep -Fq 'android.permission.INTERNET' release-permissions.txt
          ! unzip -Z1 "$APK" | grep -q '^assets/index\.html$'
          test -s app/build/outputs/mapping/release/mapping.txt

          NATIVE_SO_COUNT="$(unzip -Z1 "$APK" | grep -Ec '^lib/.+\.so$' || true)"

          mkdir -p dist
          cp "$APK" dist/Earthworm-Virtual-Laboratory-v1.3.9-release.apk
          cp "$AAB" dist/Earthworm-Virtual-Laboratory-v1.3.9-release.aab

          {
            echo "APPLICATION: Earthworm Virtual Laboratory"
            echo "applicationId: $APP_ID"
            echo "versionName: $VERSION_NAME"
            echo "versionCode: $VERSION_CODE"
            echo "minSdk: $MIN_SDK"
            echo "targetSdk: $TARGET_SDK"
            echo "architecture: native Jetpack Compose"
            echo "WebView payload: absent"
            echo "INTERNET permission: absent"
            echo "debuggable: false"
            echo "allowBackup: false"
            echo "usesCleartextTraffic: false"
            echo "R8 mapping: present"
            echo "resource shrinking: configured"
            echo "native .so files in APK: $NATIVE_SO_COUNT"
            echo "production certificate SHA-256: $CERT_SHA256"
            echo "certificate matches v1.3.8 production identity: PASS"
            echo "APK v2/v3 signature: PASS"
            echo "AAB JAR signature: PASS"
            echo "APK SHA-256: $(sha256sum dist/Earthworm-Virtual-Laboratory-v1.3.9-release.apk | awk '{print $1}')"
            echo "AAB SHA-256: $(sha256sum dist/Earthworm-Virtual-Laboratory-v1.3.9-release.aab | awk '{print $1}')"
            echo "8 HQ WebP source plates: preserved"
            echo "16 bilingual SVG source plates: preserved"
            echo "55 structures / 55 hotspot coordinates: preserved"
            echo "Native in-app Privacy Policy: present"
            echo "Public store Privacy Policy URL: https://rameshgascngl-create.github.io/Earthworm-Virtual-Laboratory/privacy.html"
            echo "STATIC PRODUCTION AUDIT: PASS"
            echo "DEVICE SMOKE TEST OF SIGNED APK: REQUIRED BEFORE STORE UPLOAD"
          } > dist/release-evidence.txt
          cat dist/release-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-Virtual-Laboratory-v1.3.9-SIGNED-NATIVE-RELEASE
          path: |
            dist/Earthworm-Virtual-Laboratory-v1.3.9-release.apk
            dist/Earthworm-Virtual-Laboratory-v1.3.9-release.aab
            dist/release-evidence.txt
            release-signing.txt
            aab-signing.txt
            release-manifest.xml
            release-badging.txt
            release-permissions.txt
            keystore-evidence.txt
          if-no-files-found: error
          retention-days: 30
