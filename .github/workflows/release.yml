name: Build signed Earthworm v1.3.5 release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthworm-v1.3.5-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Source, content and narration regression tests
        run: npm test
      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser rendering checks
        run: npm run test:browser

  signed-release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EARTHWORM_KEYSTORE_PASSWORD: ${{ secrets.EARTHWORM_KEYSTORE_PASSWORD }}
      EARTHWORM_KEY_ALIAS: ${{ secrets.EARTHWORM_KEY_ALIAS }}
      EARTHWORM_KEY_PASSWORD: ${{ secrets.EARTHWORM_KEY_PASSWORD }}
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Signed release is permitted only from main."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent release keystore
        shell: bash
        env:
          EARTHWORM_KEYSTORE_BASE64: ${{ secrets.EARTHWORM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$EARTHWORM_KEYSTORE_BASE64" || { echo "EARTHWORM_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$EARTHWORM_KEYSTORE_PASSWORD" || { echo "EARTHWORM_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$EARTHWORM_KEY_ALIAS" || { echo "EARTHWORM_KEY_ALIAS is missing."; exit 1; }
          test -n "$EARTHWORM_KEY_PASSWORD" || { echo "EARTHWORM_KEY_PASSWORD is missing."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/earthworm-release.jks"
          printf '%s' "$EARTHWORM_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "EARTHWORM_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Clean signed release build
        run: gradle --no-daemon clean :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify actual generated release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$APK" && test -f "$APK" || { echo "Signed release APK not found."; exit 1; }
          test -n "$AAB" && test -f "$AAB" || { echo "Release AAB not found."; exit 1; }

          apksigner verify --verbose --print-certs "$APK" | tee release-signing.txt
          if grep -Fq '38:B2:7E:E2:1D:5F:E5:A0:FE:6E:B3:F1:33:1E:2B:F9:E0:F8:C9:8F:7E:0A:5B:CB:EE:70:26:71:E2:A2:F7:6C' release-signing.txt; then
            echo "Debug certificate fingerprint detected."
            exit 1
          fi

          apkanalyzer manifest print "$APK" > release-manifest.xml
          grep -Fq 'package="in.ramesh.zoology.earthwormlab"' release-manifest.xml
          grep -Fq 'android:versionName="1.3.5"' release-manifest.xml
          if grep -Fq 'android:debuggable="true"' release-manifest.xml; then
            echo "Release APK is debuggable."
            exit 1
          fi
          if grep -Fq 'android.permission.INTERNET' release-manifest.xml; then
            echo "Unexpected INTERNET permission detected."
            exit 1
          fi

          unzip -l "$APK" | grep -Fq 'assets/index.html'
          unzip -p "$APK" assets/index.html | grep -Fq 'APP_VERSION="1.3.5"'

          mkdir -p dist
          cp "$APK" dist/Earthworm-Virtual-Laboratory-v1.3.5-release.apk
          cp "$AAB" dist/Earthworm-Virtual-Laboratory-v1.3.5-release.aab
          {
            echo "APK filename: Earthworm-Virtual-Laboratory-v1.3.5-release.apk"
            echo "APK file size: $(stat -c%s dist/Earthworm-Virtual-Laboratory-v1.3.5-release.apk) bytes"
            echo "APK SHA-256: $(sha256sum dist/Earthworm-Virtual-Laboratory-v1.3.5-release.apk | awk '{print $1}')"
            echo "applicationId: in.ramesh.zoology.earthwormlab"
            echo "versionName: 1.3.5"
            echo "versionCode: 10305"
            echo "minSdk: 24"
            echo "targetSdk: 36"
            echo "debuggable: false"
            echo "WebView debugging: BuildConfig.DEBUG (false in release)"
            echo "Compilation/build type: release"
            echo "INTERNET permission: absent"
            echo "allowBackup: false"
            echo "usesCleartextTraffic: false"
            echo "assets/index.html present: yes"
            echo "Embedded APP_VERSION: 1.3.5"
            echo "CLEAN RELEASE BUILD: PASS"
            echo "VERSION CONSISTENCY: PASS"
            echo "OFFLINE PAYLOAD: PASS"
            echo "STATIC APK AUDIT: PASS"
            echo "DEVICE SMOKE TEST: NOT PERFORMED"
          } > dist/release-evidence.txt
          cat dist/release-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Earthworm-Virtual-Laboratory-v1.3.5-SIGNED-RELEASE
          path: |
            dist/Earthworm-Virtual-Laboratory-v1.3.5-release.apk
            dist/Earthworm-Virtual-Laboratory-v1.3.5-release.aab
            dist/release-evidence.txt
            release-signing.txt
            release-manifest.xml
          if-no-files-found: error
          retention-days: 30
