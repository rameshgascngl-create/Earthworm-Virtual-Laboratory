name: Materialize authoritative HQ atlas payload

on:
  push:
    branches:
      - integration/v1.3.8-hq-atlas-20260926

permissions:
  contents: write

concurrency:
  group: earthworm-hq-atlas-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct exact authoritative index.html
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .hq-atlas-parts -maxdepth 1 -type f -name 'part*.txt' | wc -l)" -eq 18
          cat .hq-atlas-parts/part*.txt > app/src/main/assets/index.html
          ACTUAL="$(sha256sum app/src/main/assets/index.html | awk '{print $1}')"
          EXPECTED="5dbc6fe5754891a0c6dd6b5d307be232e35a1d244fcca72788749991cbc8affd"
          echo "HQ atlas index.html SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit exact asset to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo "No payload change required."
            exit 0
          fi
          git commit -m "Integrate authoritative HQ atlas index.html"
          git push origin "HEAD:${GITHUB_REF_NAME}"