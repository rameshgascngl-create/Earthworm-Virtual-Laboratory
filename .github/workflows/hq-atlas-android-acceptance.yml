name: HQ atlas Android acceptance
on:
  push:
    branches:
      - qa/v1.3.8-hq-atlas-20260926
permissions:
  contents: read

jobs:
  hq-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify authoritative payload before testing
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="5dbc6fe5754891a0c6dd6b5d307be232e35a1d244fcca72788749991cbc8affd"
          ACTUAL="$(sha256sum app/src/main/assets/index.html | awk '{print $1}')"
          echo "source index.html SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Content and Tamil/native-voice contract checks
        run: |
          node tests/verify.cjs app/src/main/assets/index.html
          node tests/tamil-voice.cjs app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint and compilation
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify packaged APK payload and manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="5dbc6fe5754891a0c6dd6b5d307be232e35a1d244fcca72788749991cbc8affd"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          unzip -p "$APK" assets/index.html > /tmp/packaged-index.html
          PACKAGED="$(sha256sum /tmp/packaged-index.html | awk '{print $1}')"
          echo "packaged index.html SHA-256: $PACKAGED"
          test "$PACKAGED" = "$EXPECTED"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT" dump badging "$APK" | head -n 8
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          echo "No INTERNET permission in packaged debug APK."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Earthworm-1.3.8-HQ-QA-DO-NOT-SUBMIT
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results*
            tests/test-results.json
            tests/tamil-voice-results.json
          if-no-files-found: warn
          retention-days: 7
